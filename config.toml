schema_version = 3

[gateway]
require_pairing = false

[channels.telegram.main]
enabled = true
bot_token = "PASTE_YOUR_TELEGRAM_BOT_TOKEN_HERE"
allowlist = ["PASTE_YOUR_NUMERIC_TELEGRAM_ID_HERE"]

[providers.models.nvidia.nim]
kind = "nvidia"
api_key = "PASTE_YOUR_NVIDIA_API_KEY_HERE"
model = "z-ai/glm-5.2"

[agents.default]
model_provider = "nvidia.nim"
mcp_bundles = ["browser"]
risk_profile = "trusted"

[risk_profiles.trusted]
level = "full"

[mcp_bundles.browser]
servers = ["render_lightpanda"]

[mcp.servers.render_lightpanda]
url = "PASTE_YOUR_LIGHTPANDA_RENDER_URL_HERE"
transport = "http"
headers = { "Content-Type" = "application/json", "Accept" = "application/json, text/event-stream" }
